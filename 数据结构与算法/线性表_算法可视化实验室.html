<body>
<div class="app">
<aside><div class="brand"><span class="mark">⌘</span><b>线性表 · 实验室</b><small>DATA STRUCTURES / CHAPTER 03</small></div><div class="navwrap" id="nav"></div><div class="navfooter">109 页课件 · 本地离线运行<br>交互式推演 · 无需安装</div></aside>
<main>
<div class="heading"><div><div class="kicker">ALGORITHM VISUALIZER / CHAPTER 03</div><h1 id="modeTitle">顺序表 · 插入</h1><p id="modeDesc"></p></div><div class="pagepill" id="pagePill"></div></div>
<div class="workspace">
<div class="leftstack">
<section class="panel"><div class="panelheading"><h2>① 设置实验数据</h2><span class="sub">支持自定义输入</span></div><div class="body"><div id="inputs" class="inputs"></div><div class="configure"><button class="btn primary" id="generateBtn">⟳ 生成演示步骤</button><button class="btn" id="defaultBtn">恢复示例</button></div><p id="error" class="error" role="alert"></p></div></section>
<section class="panel hero"><div class="panelheading"><h2>② 算法过程可视化</h2><span class="sub" id="visualSub">逐步观察数据变化</span></div><div class="vizbody"><div class="viztoolbar"><div class="legend"><span><i class="dot blue"></i>当前</span><span><i class="dot teal"></i>已完成</span><span><i class="dot amber"></i>移动 / 比较</span><span><i class="dot pink"></i>失配 / 删除</span></div><span class="chip" id="complexBadge"></span></div><div id="visual" class="viz" aria-live="polite"></div><div id="visualFoot" class="arraymeta"></div></div><div class="controller"><div class="progresshead"><span>执行进度</span><span id="progressText">0 / 0</span></div><div class="progress"><span id="progressBar"></span></div><div class="controlbar"><div class="controlbuttons"><button id="firstBtn" class="btn" title="返回开始">⏮</button><button id="prevBtn" class="btn">← 上一步</button><button id="playBtn" class="btn primary">▶ 自动播放</button><button id="nextBtn" class="btn">下一步 →</button><button id="lastBtn" class="btn" title="直接查看结果">⏭</button></div><label class="rate">速度 <input id="speed" type="range" min="1" max="5" value="3" /><span id="speedLabel">1×</span></label></div></div></section>
</div>
<div class="rightstack">
<section class="panel"><div class="panelheading"><h2>③ 步骤讲解与变量</h2><span class="sub" id="stepShort">当前步骤</span></div><div class="body"><div id="stepMessage" class="stepmsg"></div><div class="vars" id="variables"></div><div id="stepNote" class="notice"></div></div></section>
<section class="panel"><div class="panelheading"><h2>④ 算法伪代码</h2><span class="sub">当前语句高亮</span></div><div class="body"><div class="code" id="code"></div><p class="explain" id="teaching"></p><div class="question"><strong>🧠 思考题</strong><p id="quiz"></p><button id="answerBtn" class="btn pale">查看答案</button><div id="answer" class="answer hidden"></div></div></div></section>
</div></div><div class="foot">依据《第3章 线性表》课件设计 · 位序从 1 开始，数组下标从 0 开始 · 符号和复杂度可参照对应课件页码</div>
</main></div>
<script>
'use strict';
const DEFAULT_MATRIX='15,0,0,22,0,-15\n0,11,3,0,0,0\n0,0,0,-6,0,0\n0,0,0,0,0,0\n91,0,0,0,0,0\n0,0,28,0,0,0';
const CONFIG={
 arrInsert:{group:'3.3 顺序表',label:'顺序表 · 插入',page:'P.7',desc:'将新元素插入到指定的 1-based 位序。观察元素从右向左依次后移，避免覆盖数据。',complex:'O(n) 时间 · O(1) 辅助空间',fields:[['arr','数组元素','text','8,14,21,30,42'],['pos','插入位序 (1 开始)','number','3'],['value','新元素','number','99']],code:['if (pos < 1 || pos > n+1) return false;','for (j = n; j >= pos; j--)','    data[j] = data[j-1];','data[pos-1] = value;','n++;'],teach:'先移动最后一个元素，最后写入新数据。最坏需移动 n 个元素。',quiz:'为什么插入时要从右往左移动，而不是从左往右？',answer:'从左往右先覆盖 data[pos]，会丢失原值；从右往左移动才能保留后续数据。'},
 arrDelete:{group:'3.3 顺序表',label:'顺序表 · 删除',page:'P.8',desc:'删除指定位序，并让后续元素逐个向左填补空缺。',complex:'O(n) 时间 · O(1) 辅助空间',fields:[['arr','数组元素','text','8,14,21,30,42'],['pos','删除位序 (1 开始)','number','3']],code:['if (pos < 1 || pos > n) return false;','for (j = pos; j < n; j++)','    data[j-1] = data[j];','n--;'],teach:'删除后需要左移元素，长度减 1；原末尾数据在逻辑上不再有效。',quiz:'删除最后一个元素，需要执行数据搬移循环吗？',answer:'不需要。此时 j 从 n 开始，j < n 不成立，直接 n--。'},
 poly:{group:'3.3 顺序表',label:'多项式 · 归并加法',page:'P.17–22',desc:'非零项按指数降序排列，双指针线性归并；相同指数系数相加，和为 0 时不写入。',complex:'O(m+n) 时间',fields:[['a','A 的非零项：系数:指数','text','3:2,2:1,4:0'],['b','B 的非零项：系数:指数','text','1:4,10:3,3:2,1:0']],code:['i = 0; j = 0; result = [];','while (i < A.length && j < B.length) {','  if (A[i].exp === B[j].exp) {','    if (A[i].coef + B[j].coef !== 0) append(sum);','    i++; j++;','  } else if (A[i].exp > B[j].exp) append(A[i++]);','  else append(B[j++]);','}','append(all remaining terms);'],teach:'课件的非零项存储方案 3；输出项可用容量翻倍的动态数组。',quiz:'两个指数相同的项相加，系数恰好等于 0，结果怎样处理？',answer:'不存储零系数项，保持结果中的每一项都非零。'},
 sparseSlow:{group:'3.3 稀疏矩阵',label:'稀疏矩阵 · 普通转置',page:'P.31–38',desc:'按原矩阵列号逐列扫描三元组，把 (row,col,value) 变为 (col,row,value)。',complex:'O(cols × terms)',fields:[['matrix','矩阵 (逗号分列、换行分行)','textarea',DEFAULT_MATRIX]],code:['B = new SparseMatrix(cols, rows, terms);','k = 0;','for (col = 0; col < cols; col++)','  for (i = 0; i < terms; i++)','    if (A[i].col === col) {','      B[k] = (col, A[i].row, A[i].value);','      k++;','    }'],teach:'按列多次扫描可保证转置后的三元组仍按 (row,col) 排序，但会重复扫描。',quiz:'为什么直接把所有三元组的 row 和 col 交换，还不能作为最终有序结果？',answer:'交换后通常不再按新 (row,col) 升序排列，需重新排序或按列输出。'},
 sparseFast:{group:'3.3 稀疏矩阵',label:'稀疏矩阵 · 快速转置',page:'P.39–47',desc:'先统计每一列非零项个数，再计算转置行起始位置，实现一次扫描定位输出位置。',complex:'O(cols+terms) 时间 · O(cols) 空间',fields:[['matrix','矩阵 (逗号分列、换行分行)','textarea',DEFAULT_MATRIX]],code:['rowSize[0..cols-1] = 0;','for (term of A) rowSize[term.col]++;','rowStart[0] = 0;','for (c = 1; c < cols; c++)','  rowStart[c] = rowStart[c-1] + rowSize[c-1];','for (term of A) {','  dest = rowStart[term.col];','  B[dest] = (term.col, term.row, term.value);','  rowStart[term.col]++;','}'],teach:'这是典型的「空间换时间」：计数 + 前缀累加 + 定位。注意 rowStart 随插入而更新。',quiz:'为什么计算 rowStart[c] 时要加 rowSize[c-1]，而不是 rowSize[c]？',answer:'第 c 行的起始位置等于前面所有行的总元素数；第 c−1 行的个数正好是最后一段增量。'},
 brute:{group:'3.3 字符串',label:'字符串 · 朴素匹配',page:'P.53–56',desc:'逐一尝试每个对齐起点，一旦失配，模式串右移一位并从头比较。',complex:'O(NM) 最坏时间',fields:[['text','主串 S','text','ababcabcacbab'],['pattern','模式串 Pat','text','abcac']],code:['for (start = 0; start <= N-M; start++) {','  j = 0;','  while (j < M && S[start+j] === P[j])','    j++;','  if (j === M) return start;','}','return -1;'],teach:'每次失配都重置 j=0，已经比较成功的部分不能复用。返回值为 0-based 起点。',quiz:'朴素匹配最坏情况下为什么会达到 O(NM)？',answer:'每个候选起点都可能匹配 M−1 个字符后才失配，最多尝试约 N 个起点。'},
 failure:{group:'3.3 字符串',label:'KMP · 失败函数 f',page:'P.61–66',desc:'按课件定义：f[j] 是 P[0..j] 最长相等真前后缀的末尾下标；没有时为 -1。',complex:'O(M) 时间 · O(M) 空间',fields:[['pattern','模式串 Pat','text','ababaa']],code:['f[0] = -1;','for (j = 1; j < M; j++) {','  k = f[j-1];','  while (k >= 0 && P[k+1] !== P[j])','    k = f[k];','  if (P[k+1] === P[j]) f[j] = k+1;','  else f[j] = -1;','}'],teach:'注意本课件的 f[] 与常见的 LPS 长度数组相差 1：f[j] = LPS[j] − 1。',quiz:'若 Pat="abab"，f[3] 等于多少？',answer:'1。最长相等真前后缀是 "ab"，长度为 2，末尾下标为 1。'},
 kmp:{group:'3.3 字符串',label:'字符串 · KMP 匹配',page:'P.57–69',desc:'用失败函数复用已有匹配信息，主串指针 i 永不回退；遇到失配时只调整 j。',complex:'O(N+M) 时间',fields:[['text','主串 S','text','ababcabcacbab'],['pattern','模式串 Pat','text','abcac']],code:['f = failureFunction(P); i = 0; j = 0;','while (i < N && j < M) {','  if (S[i] === P[j]) { i++; j++; }','  else if (j === 0) i++;','  else j = f[j-1] + 1;','}','return j === M ? i-M : -1;'],teach:'代码中的 i 对应 PosS，j 对应 PosP；旧字符不重新比较，使用 f[j−1]+1 回退。',quiz:'KMP 失配且 j>0 时，为什么不让主串 i 回退？',answer:'前面已经匹配的字符和模式串前缀后缀信息足以排除不可能的对齐方式，因此可固定 i、只回退 j。'},
 linkTraverse:{group:'3.4 单链表',label:'单链表 · 遍历与检索',page:'P.72–75',desc:'从 first 开始沿 next 指针逐个访问。尝试检索指定位序，观察链式结构不能随机访问。',complex:'O(n) 时间 · O(1) 空间',fields:[['arr','节点数据','text','10,20,30,40,50'],['pos','希望检索的位序','number','4']],code:['current = first; index = 1;','while (current != nullptr && index < pos) {','  current = current->next;','  index++;','}','return current ? current->data : NOT_FOUND;'],teach:'链表的「第 i 个元素」需要从首节点逐个走到第 i 个节点。',quiz:'数组访问第 i 项是 O(1)，单链表访问第 i 项为什么通常是 O(i)？',answer:'单链表节点地址不连续，只能沿 next 从头逐个寻找；没有数组式地址计算。'},
 linkInsert:{group:'3.4 单链表',label:'单链表 · 插入',page:'P.76–77',desc:'先定位第 i−1 个节点，设置新节点的 next，再修改前驱的 next；头插是特例。',complex:'定位 O(n) · 修改指针 O(1)',fields:[['arr','节点数据','text','10,20,30,40,50'],['pos','插入位序','number','3'],['value','新节点数据','number','99']],code:['if (pos < 1 || pos > n+1) error;','if (pos === 1) first = new Node(value, first);','else {','  current = nodeAt(pos-1);','  fresh = new Node(value, current->next);','  current->next = fresh;','}'],teach:'核心是改变链接，而不是像顺序表那样搬移数据元素。',quiz:'为什么需要先让新节点指向后继，再修改前驱节点的指针？',answer:'先保存原链表的后半段入口，否则直接改前驱 next 就可能断链。'},
 linkDelete:{group:'3.4 单链表',label:'单链表 · 删除',page:'P.78–80',desc:'找到待删节点的前驱，绕过待删节点，再释放它。删除头节点要修改 first。',complex:'定位 O(n) · 修改指针 O(1)',fields:[['arr','节点数据','text','10,20,30,40,50'],['pos','删除位序','number','3']],code:['if (pos < 1 || pos > n) error;','if (pos === 1) {','  victim = first; first = first->next;','} else {','  current = nodeAt(pos-1);','  victim = current->next;','  current->next = victim->next;','}','delete victim;'],teach:'修改指针不等于释放内存，实际 C++ 中还要 delete 待删节点。',quiz:'只执行 current->next = victim->next 而不 delete victim，会怎样？',answer:'链表逻辑上已删除该节点，但分配的节点内存仍未释放，会发生内存泄漏。'},
 linkReverse:{group:'3.4 单链表',label:'单链表 · 原地逆置',page:'P.81–82',desc:'沿用课件的 current、previous、pp 三指针思路。箭头翻转而节点数据不搬动。',complex:'O(n) 时间 · O(1) 空间',fields:[['arr','节点数据','text','10,20,30,40,50']],code:['current = first; previous = pp = nullptr;','while (current != nullptr) {','  pp = previous;','  previous = current;','  current = current->next;','  previous->next = pp;','}','first = previous;'],teach:'展示每次循环里的四个赋值步骤。要在反向链接前记住后续节点！',quiz:'为什么不能一开始直接执行 current->next = previous？',answer:'如果还没有保存旧的 current->next，可能丢失未处理链表的入口。'},
 circular:{group:'3.4 特殊链表',label:'循环链表 · 首尾插入',page:'P.90–91',desc:'以 last 为访问指针，last->next 是首节点。比较在首部和尾部插入时的常数时间更新。',complex:'已知 last 时，首插与尾插均 O(1)',fields:[['arr','节点数据','text','10,20,30'],['side','操作位置','select','front|首部插入;back|尾部插入'],['value','新节点数据','number','99']],code:['first = last ? last->next : nullptr;','fresh = new Node(value);','if (last === nullptr) fresh->next = fresh, last = fresh;','else {','  fresh->next = last->next;','  last->next = fresh;','  if (side === "back") last = fresh;','}'],teach:'环形结构永远没有常规尾结点的 nullptr；空表插入时新节点指向自身。',quiz:'为什么循环单链表用 last 指针访问，尾插可做到 O(1)？',answer:'因为 last->next 就是首节点，可以直接在 last 后面接入节点并更新 last，无需遍历。'},
 doubly:{group:'3.4 特殊链表',label:'双链表 · 指针调整',page:'P.95–98',desc:'用普通双链表示例，显式展示 prev 和 next；插入/删除时检查双向一致性。',complex:'给定位置节点时，链接修改 O(1)',fields:[['arr','节点数据','text','10,20,30,40'],['action','操作类型','select','insert|插入;delete|删除'],['pos','操作位序','number','3'],['value','插入的新值','number','99']],code:['// insert before node at pos','fresh.prev = left; fresh.next = right;','if (left) left.next = fresh; else first = fresh;','if (right) right.prev = fresh;','// delete victim','if (victim.prev) victim.prev.next = victim.next;','else first = victim.next;','if (victim.next) victim.next.prev = victim.prev;','delete victim;'],teach:'保持 p == p->prev->next == p->next->prev（边界处需例外处理）。',quiz:'在双链表中删除一个中间节点，需要修改相邻几个指针？',answer:'需要修改前驱节点的 next 和后继节点的 prev，共两个相邻节点的指针。'},
 generalized:{group:'3.5 广义表',label:'广义表 · 递归深度与长度',page:'P.99–109',desc:'元素可以是原子或子表；递归计算最大嵌套深度，直接计数最外层元素得到长度。',complex:'深度 O(N) 时间 · O(h) 递归栈',fields:[['expr','广义表表达式','text','(a,(b,c),d,(e,(f,g)))']],code:['Depth(atom) = 0;','Depth(emptyList) = 1;','Depth(list) = 1 + max(Depth(child));','Length(list) = number of top-level children;','// Recursively visit nested sublists','for (child of list) compute Depth(child);','return 1 + maxChildDepth;'],teach:'空表 () 的长度是 0、深度是 1；例如 (a,(b,c),d) 长度为 3、深度为 2。',quiz:'广义表 (a,(b,c),d) 的长度和深度分别是多少？',answer:'长度是 3（最外层 a、(b,c)、d），深度是 2（两层括号）。'}

const $=id=>document.getElementById(id);
const clone=x=>JSON.parse(JSON.stringify(x));
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mode='arrInsert',steps=[],stepIndex=0,timer=null,answerOpen=false;
const record=(list,desc,line,scene,vars={},note='')=>{list.push({desc,line,scene:clone(scene),vars:clone(vars),note});};
const fail=(message)=>{throw new Error(message)};
function num(v,label){if(String(v).trim()===''|| !Number.isInteger(Number(v)))fail(label+' 必须是整数');let n=Number(v);if(Math.abs(n)>999999)fail(label+' 数值过大');return n;}
function nums(value,label='列表'){let a=String(value).split(/[,，\s]+/).filter(Boolean).map(x=>num(x,label));if(a.length>9)fail('为了清晰显示，节点/数组最多允许 9 项');return a;}
function parseTerms(value,label){let arr=String(value).trim();if(!arr)return [];let map=new Map();for(let p of arr.split(/[,，\s]+/).filter(Boolean)){let m=p.match(/^(-?\d+(?:\.\d+)?):([0-9]+)$/);if(!m)fail(label+' 格式应为 3:2,2:1,4:0（系数:指数）');let c=Number(m[1]),exp=Number(m[2]);if(exp>10000||!Number.isFinite(c))fail('指数或系数超出支持范围');map.set(exp,(map.get(exp)||0)+c);}return [...map].filter(([,c])=>c!==0).sort((a,b)=>b[0]-a[0]).map(([e,c])=>({e,c}));}
function parseMatrix(value){let lines=String(value).trim().split(/[;\n]+/).map(v=>v.trim()).filter(Boolean);if(!lines.length)fail('请输入矩阵');let a=lines.map(l=>l.split(/[,，\s]+/).filter(Boolean).map(x=>num(x,'矩阵元素')));let width=a[0].length;if(!width||a.some(v=>v.length!==width))fail('每行必须拥有相同列数');if(a.length>8||width>8)fail('矩阵尺寸最多 8 × 8');return a;}
function computeF(p){let pi=Array(p.length).fill(0);for(let j=1;j<p.length;j++){let k=pi[j-1];while(k>0&&p[j]!==p[k])k=pi[k-1];if(p[j]===p[k])k++;pi[j]=k;}return pi.map(v=>v-1);}
function makeArray(which,a){let L=[],s={kind:'array',array:a.slice(),n:a.length,focus:[],secondary:[],move:[],deleted:null};let pos=num(which.pos,'位序');record(L,'初始化顺序表：逻辑长度 n = '+a.length,0,s,{n:s.n},'数组下标从 0 开始；操作位序从 1 开始。');if(which.op==='insert'){if(pos<1||pos>a.length+1)fail('插入位序需要在 1 到 '+(a.length+1)+' 之间');let value=num(which.value,'新元素');s.array.push(null);s.focus=[pos-1];record(L,'为待插入元素预留一个末尾空槽，位置为 '+pos,0,s,{pos,n:s.n},'顺序存储要求连续，先为右移腾出位置。');for(let j=a.length;j>=pos;j--){let x=s.array[j-1];s.array[j]=x;s.focus=[j];s.move=[j-1];record(L,`向右移动：data[${j}] ← data[${j-1}] = ${x}`,2,s,{j,from:j-1,to:j},'按照下标从大到小的顺序搬移，防止覆盖未搬的数据。');}s.array[pos-1]=value;s.focus=[pos-1];s.move=[];record(L,`写入新元素：data[${pos-1}] = ${value}`,3,s,{pos,value},'插入元素放在位序 pos 对应的数组下标 pos−1。');s.n++;record(L,'插入完成：长度 n 增加 1',4,s,{n:s.n},'数组逻辑长度已更新。');}else{if(pos<1||pos>a.length)fail('删除位序需要在 1 到 '+a.length+' 之间');s.focus=[pos-1];s.deleted=s.array[pos-1];record(L,`定位待删元素 ${s.deleted}，位序 ${pos}`,0,s,{pos,deleted:s.deleted},'接下来用后续元素覆盖被删除的位置。');for(let j=pos;j<a.length;j++){let x=s.array[j];s.array[j-1]=x;s.focus=[j-1];s.move=[j];record(L,`向左移动：data[${j-1}] ← data[${j}] = ${x}`,2,s,{j,from:j,to:j-1},'从左往右搬移，逐一填补空位。');}s.array.pop();s.n--;s.move=[];s.focus=[];record(L,'删除完成：逻辑长度 n 减少 1',3,s,{n:s.n},'末尾超出逻辑长度的元素不再属于线性表。');}return L;}
function makePoly(inputs){let a=parseTerms(inputs.a,'A'),b=parseTerms(inputs.b,'B');if(a.length+b.length>26)fail('非零项总数过多，请控制在 26 项以内');let L=[],s={kind:'poly',a,b,c:[],i:0,j:0,capacity:1};record(L,'A、B 的非零项分别按指数降序排列',0,s,{i:0,j:0,capacity:1},'相同指数将对齐相加；否则取指数较大的项。');function append(t){if(s.c.length===s.capacity){s.capacity*=2;record(L,`输出数组空间不足，容量翻倍至 ${s.capacity}`,0,s,{capacity:s.capacity},'课件第 20–22 页的动态数组扩容策略。');}s.c.push({...t});record(L,`向结果写入 ${t.c}×x^${t.e}`,t._line||5,s,{i:s.i,j:s.j,terms:s.c.length,capacity:s.capacity});}
while(s.i<a.length&&s.j<b.length){let x=a[s.i],y=b[s.j];record(L,`比较指数：A 为 ${x.e}，B 为 ${y.e}`,2,s,{aPos:s.i,bPos:s.j});if(x.e===y.e){let sum=x.c+y.c;record(L,`指数相同，系数相加：${x.c} + ${y.c} = ${sum}`,3,s,{exp:x.e,sum},sum===0?'和为 0：不存储这个项。':'和非零：写入结果。');if(sum!==0)append({e:x.e,c:sum,_line:3});s.i++;s.j++;record(L,'两个指针同时向右移动',4,s,{i:s.i,j:s.j});}else if(x.e>y.e){append({e:x.e,c:x.c,_line:5});s.i++;record(L,'A 的指数较大，移动 A 指针',5,s,{i:s.i,j:s.j});}else{append({e:y.e,c:y.c,_line:6});s.j++;record(L,'B 的指数较大，移动 B 指针',6,s,{i:s.i,j:s.j});}}
while(s.i<a.length){let t=a[s.i];append({...t,_line:8});s.i++;record(L,'复制 A 中剩余的非零项',8,s,{i:s.i,j:s.j});}while(s.j<b.length){let t=b[s.j];append({...t,_line:8});s.j++;record(L,'复制 B 中剩余的非零项',8,s,{i:s.i,j:s.j});}record(L,'归并加法完成：C(x) = A(x) + B(x)',8,s,{terms:s.c.length},'两个输入各扫描一次，总时间 O(m+n)，扩容摊销后不改变量级。');return L;}
function makeSparse(inp,fast){let a=parseMatrix(inp.matrix),rows=a.length,cols=a[0].length,terms=[];for(let i=0;i<rows;i++)for(let j=0;j<cols;j++)if(a[i][j]!==0)terms.push({r:i,c:j,v:a[i][j]});let L=[],s={kind:'matrix',a,b:Array.from({length:cols},()=>Array(rows).fill(0)),terms,output:Array(terms.length).fill(null),count:Array(cols).fill(0),start:Array(cols).fill(null),picked:-1,written:-1,col:-1,phase:'初始化'};record(L,`原矩阵 ${rows}×${cols}，共 ${terms.length} 个非零项`,0,s,{rows,cols,terms:terms.length},'每个非零元素存为 (row,col,value) 三元组，按行号和列号升序。');if(fast){for(let k=0;k<cols;k++)s.count[k]=0;record(L,'创建长度为 cols 的 rowSize 数组并全部清零',0,s,{cols},'rowSize[c] 表示转置矩阵第 c 行的元素个数。');for(let i=0;i<terms.length;i++){let t=terms[i];s.count[t.c]++;s.picked=i;s.col=t.c;s.phase='统计列元素数';record(L,`原三元组 ${i} 属于第 ${t.c} 列：rowSize[${t.c}]++`,1,s,{i,col:t.c,count:s.count[t.c]});}if(cols){s.start[0]=0;record(L,'首行起始位置 rowStart[0] = 0',2,s,{c:0,start:0});}for(let c=1;c<cols;c++){s.start[c]=s.start[c-1]+s.count[c-1];s.col=c;s.phase='计算前缀起点';record(L,`rowStart[${c}] = rowStart[${c-1}] + rowSize[${c-1}] = ${s.start[c]}`,4,s,{c,start:s.start[c]},'只加当前行之前所有行的元素个数。');}for(let i=0;i<terms.length;i++){let t=terms[i],where=s.start[t.c];s.picked=i;s.col=t.c;s.phase='直接定位写入';record(L,`读取原三元组 ${i}：使用 rowStart[${t.c}] = ${where}`,6,s,{i,dest:where},'转置后旧列号变为新行号。');s.output[where]={r:t.c,c:t.r,v:t.v};s.b[t.c][t.r]=t.v;s.written=where;record(L,`将 (${t.r},${t.c},${t.v}) 写到 B[${where}] = (${t.c},${t.r},${t.v})`,7,s,{i,dest:where});s.start[t.c]++;record(L,`rowStart[${t.c}]++，下一项将放到位置 ${s.start[t.c]}`,8,s,{col:t.c,next:s.start[t.c]});}}else{let k=0;for(let c=0;c<cols;c++){s.col=c;s.picked=-1;s.phase='按列扫描';record(L,`开始扫描原矩阵的第 ${c} 列`,2,s,{col:c},'当前列中的非零项将在转置后构成一整行。');for(let i=0;i<terms.length;i++){s.picked=i;record(L,`检查三元组 ${i}：其列号 ${terms[i].c} ${terms[i].c===c?'等于':'不等于'} ${c}`,4,s,{i,col:c});if(terms[i].c===c){let t=terms[i];s.output[k]={r:t.c,c:t.r,v:t.v};s.b[t.c][t.r]=t.v;s.written=k;record(L,`写入 B[${k}] = ($ function choose(newMode){halt();mode=newMode;answerOpen=false;let c=CONFIG[mode];renderNav();$('modeTitle').textContent=c.label;$('modeDesc').textContent=c.desc;$('pagePill').textContent='课件参考 '+c.page;$('complexBadge').textContent=c.complex;$('inputs').innerHTML=c.fields.map(nodeInput).join('');$('teaching').innerHTML='<b>理解关键：</b>'+esc(c.teach);$('quiz').textContent=c.quiz;$('answer').textContent=c.answer;$('answer').classList.add('hidden');$('answerBtn').textContent='查看答案';$('code').innerHTML=c.code.map((v,i)=>`<div class="code-line" data-code="${i}"><span class="lineno">${i+1}</span><span class="txt">${esc(v)}</span></div>`).join('');regenerate();}
function regenerate(){halt();try{let args={};for(let f of CONFIG[mode].fields)args[f[0]]=$('f_'+f[0]).value;let newSteps=build(mode,args);if(!newSteps.length)fail('此输入未产生步骤');steps=newSteps;stepIndex=0;$('error').textContent='';render();}catch(e){$('error').textContent=e.message||String(e);}}
function render(){if(!steps.length)return;let t=steps[stepIndex];$('progressText').textContent=(stepIndex+1)+' / '+steps.length;$('progressBar').style.width=(100*(stepIndex+1)/steps.length)+'%';$('stepShort').textContent='STEP '+String(stepIndex+1).padStart(2,'0');$('stepMessage').innerHTML=`<span class="stepnum">STEP ${String(stepIndex+1).padStart(2,'0')} / ${String(steps.length).padStart(2,'0')}</span>${esc(t.desc)}`;$('variables').innerHTML=Object.entries(t.vars||{}).map(([k,v])=>`<span class="var">${esc(k)} = <b>${esc(v)}</b></span>`).join('');$('stepNote').textContent=t.note||CONFIG[mode].teach;for(let x of $('code').querySelectorAll('.code-line'))x.classList.toggle('hl',Number(x.dataset.code)===t.line);$('visual').innerHTML=renderScene(t.scene);$('visualFoot').innerHTML=sceneSummary(t.scene);$('prevBtn').disabled=stepIndex===0;$('firstBtn').disabled=stepIndex===0;$('nextBtn').disabled=stepIndex===steps.length-1;$('lastBtn').disabled=stepIndex===steps.length-1;}
function sceneSummary(s){if(s.kind==='array')return `<span class="chip">元素数 n: <b>${s.n}</b></span><span class="chip">数组下标: <b>0 ~ ${Math.max(s.array.length-1,0)}</b></span>`;if(s.kind==='poly')return `<span class="chip">A 指针: <b>${s.i}</b></span><span class="chip">B 指针: <b>${s.j}</b></span><span class="chip">结果项数: <b>${s.c.length}</b></span><span class="chip">容量 capacity: <b>${s.capacity}</b></span>`;if(s.kind==='matrix')return `<span class="chip">阶段: <b>${esc(s.phase)}</b></span><span class="chip">非零项: <b>${s.terms.length}</b></span>`;if(s.kind==='match')return `<span class="chip">主串指针 i: <b>${s.i}</b></span><span class="chip">模式指针 j: <b>${s.j}</b></span>${s.result!==null?`<span class="chip">匹配起点: <b>${s.result}</b></span>`:''}`;if(s.kind==='failure')return `<span class="chip">当前 j: <b>${s.j<0?'完成':s.j}</b></span><span class="chip">已计算: <b>${s.f.filter(x=>x!==null).length} / ${s.f.length}</b></span>`;if(s.kind==='link')return `<span class="chip">有效节点 / 展示节点: <b>${s.nodes.length}</b></span><span class="chip">类型: <b>${s.circular?'循环单链表':s.doubly?'双链表':'单链表'}</b></span>`;if(s.kind==='gen')return `<span class="chip">递归栈层数: <b>${s.stack.length}</b></span>${s.result?`<span class="chip">长度: <b>${s.result.length}</b></span><span class="chip">深度: <b>${s.result.depth}</b></span>`:''}`;return '';}
function rowSlots(a,focus=[],secondary=[],move=[],n=a.length){return '<div class="slots">'+a.map((x,i)=>`<div class="slot ${focus.includes(i)?'focus':''} ${secondary.includes(i)?'secondary':''} ${move.includes(i)?'moving':''} ${x===null?'ghost':''}"><small>${i}</small><strong>${x===null?'·':esc(x)}</strong>${i>=n?'<span class="flag">预留空间</span>':''}</div>`).join('')+'</div>';}
function termHTML(t,klass=''){return `<div class="term ${klass}"><span>${esc(t.c)}x<sup>${esc(t.e)}</sup></span><small>exp = ${t.e}</small></div>`;}
function polyRow(title,a,focus=-1,isOutput=false){return `<div class="poly-row"><div class="polytag">${title}</div>${a.length?a.map((t,i)=>termHTML(t,isOutput?'output':i===focus?'focus':i<focus?'past':'')).join(''):'<div class="term empty">空</div>'}</div>`;}
function matGrid(a,mark=null,secondary=null){let h=a.length,w=a[0]?.length||0;return `<div class="matrix" style="grid-template-columns:repeat(${w},43px)">`+a.map((row,i)=>row.map((v,j)=>`<span class="matcell ${v===0?'zero':''} ${mark&&mark[0]===i&&mark[1]===j?'focus':''} ${secondary&&secondary[0]===i&&secondary[1]===j?'secondary':''}">${v}</span>`).join('')).join('')+'</div>';}
function tripleTable(name,arr,index,filled){return `<div class="trip"><div class="scene-label">${name}</div><table><thead><tr><th>#</th><th>row</th><th>col</th><th>value</th></tr></thead><tbody>`+arr.map((o,i)=>`<tr class="${i===index?'selected':i===filled?'written':!o?'dim':''}"><td>${i}</td><td>${o?o.r:'—'}</td><td>${o?o.c:'—'}</td><td>${o?o.v:'—'}</td></tr>`).join('')+'</tbody></table></div>';}
function matchRow(text,s,patrow=false){let n=text.length,offset=patrow?Math.max(0,s.start):0,out='<div class="charrow">';for(let q=0;q<offset;q++)out+='<div style="width:38px;flex:none"></div>';for(let x=0;x<n;x++){let abs=patrow?offset+x:x;let cur=(patrow?x===s.j:abs===s.i)&&s.result===null;let matched=patrow?x<s.matched:abs>=s.start&&abs<s.start+s.matched;let bad=cur&&s.mismatch;out+=`<div class="char ${bad?'bad':cur?'active':matched?'good':''}"><b>${patrow?x:abs}</b>${esc(text[x])}</div>`;}return out+'</div>';}
function sceneFailure(s){return `<div class="scene-label">Pat 的字符、下标与已计算 f[j]</div><div class="fv">`+[...s.pat].map((v,i)=>`<div class="fvcol ${s.j===i?'current':s.compare===i?'compare':s.f[i]!==null?'done':''}"><small>${i}</small><span>${esc(v)}</span><small>f = ${s.f[i]===null?'?':s.f[i]}</small></div>`).join('')+'</div><div class="notice">蓝色表示正在计算的 j；橙色是要比较的字符位置。f[j] = 最长真前后缀长度 − 1。</div>';}
function svgLink(s){let nodes=s.nodes,w=Math.max(540,120+nodes.length*114),height=252,pts=new Map();nodes.forEach((n,i)=>pts.set(n.id,{x:75+i*114,y:127}));const get=id=>pts.get(id),line=[];let marker=`<defs><marker id="arrN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#657bc0"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27a79c"/></marker></defs>`;for(const n of nodes){let from=get(n.id),to=get(n.next);if(!to)continue;let path='';if(n.id===n.next){path=`M ${from.x+31} 112 C ${from.x+75} 49 ${from.x-75} 49 ${from.x-31} 112`;}else if(to.x>from.x&&to.x-from.x<150){path=`M ${from.x+32} 117 L ${to.x-35} 117`;}else if(to.x>from.x){path=`M ${from.x+30} 117 Q ${(from.x+to.x)/2} 64 ${to.x-30} 117`;}else{path=`M ${from.x-29} 137 Q ${(from.x+to.x)/2} 211 ${to.x+29} 137`;}line.push(`<path d="${path}" fill="none" stroke="#657bc0" stroke-width="2.3" marker-end="url(#arrN)"/>`);}
if(s.doubly){for(const n of nodes){let from=get(n.id),to=get(n.prev);if(!to)continue;let path=from.x>to.x?`M ${from.x-31} 150 Q ${(from.x+to.x)/2} 178 ${to.x+32} 150`:`M ${from.x+27} 150 Q ${(from.x+to.x)/2} 200 ${to.x-27} 150`;line.push(`<path d="${path}" fill="none" stroke="#27a79c" stroke-width="1.9" marker-end="url(#arrP)"/>`);}}
let marks={};for(const [name,id] of Object.entries(s.pointers||{})){if(id&&pts.has(id)){if(!marks[id])marks[id]=[];marks[id].push(name);}}
const head=get(s.head);if(head)line.push(`<text x="${head.x}" y="33" font-size="12" text-anchor="middle" fill="#465fbd" font-weight="700">first</text><path d="M ${head.x} 40 L ${head.x} 87" stroke="#667adb" stroke-width="1.7" stroke-dasharray="4 3" marker-end="url(#arrN)"/>`);else line.push('<text x="20" y="38" fill="#667adb" font-size="12">first → null</text>');for(const n of nodes){let p=get(n.id),isGhost=s.ghost===n.id,isFade=s.faded===n.id,label=marks[n.id]||[];line.push(`<rect x="${p.x-32}" y="95" width="64" height="58" rx="12" fill="${isFade?'#ffe6eb':isGhost?'#fff2de':label.length?'#e7edff':'#f6f9ff'}" stroke="${isFade?'#de7590':isGhost?'#e8ac52':label.length?'#6479eb':'#cdd9ed'}" stroke-width="2" ${isGhost?'stroke-dasharray="5 4"':''}/><text x="${p.x}" y="126" text-anchor="middle" font-size="18" font-weight="750" fill="#213655">${esc(n.v)}</text><text x="${p.x}" y="144" text-anchor="middle" font-size="10" fill="#99aac2">${esc(n.id)}</text>${label.length?`<text x="${p.x}" y="79" text-anchor="middle" font-size="11" fill="#344eae" font-weight="700">${esc(label.join(' · '))}</text>`:''}`);}
return `<div class="linkviz"><svg width="${w}" height="${height}" viewBox="0 0 ${w} ${height}" xmlns="http://www.w3.org/2000/svg">${marker}${line.join('')}</svg></div><div class="match-note">蓝色箭头：next 指针${s.doubly?'；青色箭头：prev 指针':''}。虚线框：尚未完全接入链表的新节点。</div>`;}
function treeNode(tree,path,active){let same=path.length===active.length&&path.every((v,i)=>v===active[i]),isAncestor=path.length<active.length&&path.every((v,i)=>v===active[i]);let cls=same?'active':isAncestor?'visited':'';if(!Array.isArray(tree))return `<div class="tree-node"><div class="treebadge atom ${cls}">${esc(tree)}</div></div>`;return `<div class="tree-node"><div class="treebadge ${cls}">${tree.length?'子表':'()'}</div>${tree.length?'<div class="tree-children">'+tree.map((v,i)=>treeNode(v,[...path,i],active)).join('')+'</div>':''}</div>`;}
function renderScene(s){if(s.kind==='array')return `<div class="scene-label">数组下标 → 数组元素</div>${rowSlots(s.array,s.focus,s.secondary,s.move,s.n)}`;if(s.kind==='poly')return `<div class="scene-label">双指针归并：指数降序</div>${polyRow('A',s.a,s.i)}${polyRow('B',s.b,s.j)}<div class="scene-label">结果多项式 C(x)</div>${polyRow('C',s.c,-1,true)}`;if(s.kind==='matrix'){let picked=s.terms[s.picked],written=s.output[s.written];return `<div class="mat-wrap"><div><div class="scene-label">原矩阵 A (${s.a.length}×${s.a[0].length})</div>${matGrid(s.a,picked?[picked.r,picked.c]:null)}</div><div><div class="scene-label">转置矩阵 B (${s.b.length}×${s.b[0].length})</div>${matGrid(s.b,null,written?[written.r,written.c]:null)}</div></div><div class="triples" style="margin-top:16px">${tripleTable('A 的非零三元组',s.terms,s.picked,-1)}${tripleTable('B 的三元组位置',s.output,-1,s.written)}</div>${mode==='sparseFast'?`<div class="scene-label" style="margin-top:14px">rowSize / rowStart</div><div class="aux">${s.count.map((n,i)=>`<div class="aux-item"><small>列 ${i}</small><strong>${n}</strong><small>start: ${s.start[i]===null?'?':s.start[i]}</small></div>`).join('')}</div>`:''}`;}if(s.kind==='match')return `<div class="scene-label">主串 S（上） / 模式串 Pat（下）</div><div class="matchrows">${matchRow(s.text,s)}${matchRow(s.pat,s,true)}</div>${s.kmp?`<div class="scene-label" style="margin-top:18px">失败函数 f[j]</div><div class="aux">${s.fail.map((v,i)=>`<div class="aux-item"><small>${i}</small>${v}</div>`).join('')}</div>`:''}<div class="match-note">绿色：已匹配的前缀；蓝色：当前对比位置。${s.result!==null?`结果：${s.result>=0?`在下标 ${s.result} 处找到匹配`:'未匹配'}`:''}</div>`;if(s.kind==='failure')return sceneFailure(s);if(s.kind==='link')return svgLink(s);if(s.kind==='gen')return `<div class="scene-label">广义表嵌套结构（递归视图）</div><div class="depthTree">${treeNode(s.tree,[],s.path||[])}</div><div class="scene-label">当前递归调用栈</div><div class="aux">${s.stack.length?s.stack.map((x,i)=>`<div class="aux-item"><small>层 ${i+1}</small>${esc(x)}</div>`).join(''):'<span class="chip">递归调用已返回</span>'}</div>`;return '';}
function move(dir){if(!steps.length)return;let next=Math.max(0,Math.min(steps.length-1,stepIndex+dir));stepIndex=next;render();if(stepIndex>=steps.length-1)halt();}
function speedInterval(){return [1350,950,620,350,170][Number($('speed').value)-1]||620;}
function play(){if(timer){halt();return;}if(stepIndex===steps.length-1)stepIndex=0;render();$('playBtn').textContent='⏸ 暂停';timer=setInterval(()=>move(1),speedInterval());}
$('generateBtn').addEventListener('click',regenerate);$('defaultBtn').addEventListener('click',()=>choose(mode));$('prevBtn').addEventListener('click',()=>{halt();move(-1)});$('nextBtn').addEventListener('click',()=>{halt();move(1)});$('firstBtn').addEventListener('click',()=>{halt();stepIndex=0;render()});$('lastBtn').addEventListener('click',()=>{halt();stepIndex=steps.length-1;render()});$('playBtn').addEventListener('click',play);$('speed').addEventListener('input',()=>{let n=Number($('speed').value);$('speedLabel').textContent=['0.6×','0.8×','1×','2×','4×'][n-1];if(timer){halt();play();}});$('answerBtn').addEventListener('click',()=>{answerOpen=!answerOpen;$('answer').classList.toggle('hidden',!answerOpen);$('answerBtn').textContent=answerOpen?'收起答案':'查看答案'});document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'){halt();move(1)}else if(e.key==='ArrowLeft'){halt();move(-1)}else if(e.code==='Space'&&e.target===document.body){e.preventDefault();play();}});
choose(mode);
</script>
</body>
</html>
