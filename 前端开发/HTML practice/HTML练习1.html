<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>HTML练习1</title>
  </head>
  <body>
    <h1>一级标题</h1>
    <h2>二级标题</h2>
    <h3>三级标题</h3>
    <h4>四级标题</h4>
    <h5>五级标题</h5>
    <h6>六级标题</h6>
    <p>这是一个段落</p>
    <s>这是一个删除线</s> <br />
    <u>这是一个下划线</u> <br />
    <strong>这是一个加粗的字体</strong> <br />
    <b>这也是一个加粗的字体</b> <br />
    <i>这是一个斜体的字体</i> <br />
    <small>这是一个小号字体</small>
    <br />
    <ul>
      <li>无序列表项1</li>
      <li>无序列表项2</li>
      <li>无序列表项3</li>
    </ul>
    <ol>
      <li>有序列表项1</li>
      <li>有序列表项2</li>
      <li>有序列表项3</li>
    </ol>
    <table border="2">
      <tr>
        <th>表头1</th>
        <th>表头2</th>
        <th>表头3</th>
      </tr>
      <tr>
        <td>表格单元格1</td>
        <td>表格单元格2</td>
        <td>表格单元格3</td>
      </tr>
      <tr>
        <td>表格单元格4</td>
        <td>表格单元格5</td>
        <td>表格单元格6</td>
      </tr>
      <tr>
        <td>表格单元格7</td>
        <td>表格单元格8</td>
        <td>表格单元格9</td>
      </tr>
    </table>

    <a href="https://www.baidu.com">百度一下</a>
    <br />
    <img src="https://www.baidu.com/img/bd_logo1.png" alt="百度logo" />
  </body>
</html>
